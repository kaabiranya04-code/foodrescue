# Complète src/main/resources/application.properties (config/ a priorité sur la racine)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Coefficients d'impact (estimations, modifiables par variables d'environnement)
#   IMPACT_MEALS_PER_KG    : 1 repas ~ 500 g de nourriture
#   IMPACT_CO2_KG_PER_KG   : kg de CO2e évités par kg de nourriture sauvé
impact.meals-per-kg=2.0
impact.co2-kg-per-kg=2.5

springdoc.swagger-ui.path=/swagger-ui.html
