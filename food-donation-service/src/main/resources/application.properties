spring.application.name=food-donation-service
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/donationdb}
spring.datasource.username=${DB_USER:foodrescue}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
