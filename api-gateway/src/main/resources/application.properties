spring.application.name=api-gateway
server.port=8080

# Routage : /api/v1/** -> food-donation-service (DNS Docker Compose)
spring.cloud.gateway.routes[0].id=food-donation
spring.cloud.gateway.routes[0].uri=${FOOD_DONATION_URL:http://localhost:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/**

management.endpoints.web.exposure.include=health,info
